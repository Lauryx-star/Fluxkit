[package]
name = "fluxkit"
version = "0.1.6"
description = "A local desktop API client"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-only"

[lib]
name = "fluxkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

serde_json = "1"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize", "serialize"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
rfd = "0.16"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "multipart", "stream", "form", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
argon2 = { version = "=0.5.3", features = ["zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }
